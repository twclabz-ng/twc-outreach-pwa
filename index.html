<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TWC Outreach Tracker | MedCRM PWA</title>
  <meta name="theme-color" content="#0F2942" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TWC Outreach" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: #0F2942; color: #FFF; }
    .pwa-bar { height: 48px; background: #0F2942; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.12); }
    .brand { font-size: 14px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
    .actions { display: flex; align-items: center; gap: 8px; }
    .btn-install { background: #007AFF; color: #FFF; border: none; border-radius: 14px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-config { background: rgba(255,255,255,0.12); color: #E2E8F0; border: none; border-radius: 14px; padding: 6px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
    iframe { width: 100%; height: calc(100% - 48px); border: none; background: #F2F2F7; }
    body.standalone .pwa-bar { display: none; }
    body.standalone iframe { height: 100%; }
    .setup-overlay { position: fixed; inset: 48px 0 0 0; background: #F2F2F7; color: #0F172A; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
    .setup-card { background: #FFF; border-radius: 20px; max-width: 480px; width: 100%; padding: 24px; box-shadow: 0 12px 32px rgba(15,41,66,0.12); border: 1px solid #E2E8F0; }
    .setup-card h2 { font-size: 18px; color: #0F2942; margin-bottom: 8px; }
    .setup-card p { font-size: 13px; color: #475569; line-height: 1.5; margin-bottom: 14px; }
    .setup-input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #CBD5E1; font-size: 13px; margin-bottom: 12px; outline: none; }
    .setup-btn { width: 100%; padding: 12px; border-radius: 12px; border: none; background: #007AFF; color: #FFF; font-weight: 700; font-size: 14px; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="pwa-bar">
    <span class="brand">TWC Outreach Tracker PWA</span>
    <div class="actions">
      <button class="btn-config" onclick="openSetup()">GAS URL</button>
      <button id="installBtn" class="btn-install" onclick="installPWA()">Install App</button>
    </div>
  </header>

  <div id="setupOverlay" class="setup-overlay hidden">
    <div class="setup-card">
      <h2>Connect Google Apps Script Web App</h2>
      <p>Your deployed Google Apps Script <code>/exec</code> Web App URL is pre-configured below. You can update it anytime if you create a new deployment.</p>
      <input id="gasUrlInput" class="setup-input" type="url" value="https://script.google.com/macros/s/AKfycbyaY4yIr45B3aPNrYrYvc12hl0bcFhrcB6Tce0_1TxzwR5uapfEIuArjj1aD8f2Jbhl/exec" placeholder="https://script.google.com/macros/s/.../exec" />
      <button class="setup-btn" onclick="saveGasUrl()">Launch Outreach Tracker</button>
    </div>
  </div>

  <iframe id="gasFrame" src="https://script.google.com/macros/s/AKfycbyaY4yIr45B3aPNrYrYvc12hl0bcFhrcB6Tce0_1TxzwR5uapfEIuArjj1aD8f2Jbhl/exec" allow="clipboard-read; clipboard-write; geolocation"></iframe>

  <script>
    // Pre-configured with your live Google Apps Script /exec Web App URL:
    const DEFAULT_GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyaY4yIr45B3aPNrYrYvc12hl0bcFhrcB6Tce0_1TxzwR5uapfEIuArjj1aD8f2Jbhl/exec';

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
      document.body.classList.add('standalone');
    }

    function initFrame() {
      const params = new URLSearchParams(window.location.search);
      const urlParam = params.get('gas');
      if (urlParam && urlParam.startsWith('https://script.google.com/')) {
        localStorage.setItem('twc_gas_exec_url', urlParam);
      }
      const savedUrl = localStorage.getItem('twc_gas_exec_url') || DEFAULT_GAS_WEB_APP_URL;
      const frame = document.getElementById('gasFrame');
      const overlay = document.getElementById('setupOverlay');
      if (!savedUrl || savedUrl.includes('YOUR_GAS_DEPLOYMENT_ID')) {
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
        frame.src = savedUrl;
      }
    }

    function openSetup() {
      const savedUrl = localStorage.getItem('twc_gas_exec_url') || DEFAULT_GAS_WEB_APP_URL;
      document.getElementById('gasUrlInput').value = savedUrl;
      document.getElementById('setupOverlay').classList.remove('hidden');
    }

    function saveGasUrl() {
      const val = document.getElementById('gasUrlInput').value.trim();
      if (!val.startsWith('https://script.google.com/')) {
        alert('Please enter a valid https://script.google.com/macros/s/.../exec URL');
        return;
      }
      localStorage.setItem('twc_gas_exec_url', val);
      initFrame();
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    async function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      } else {
        alert('To install TWC Outreach Tracker:\n• iOS Safari: Tap Share -> Add to Home Screen\n• Android / Desktop Chrome: Tap browser menu (⋮) -> Install App');
      }
    }

    initFrame();
  </script>
</body>
</html>
